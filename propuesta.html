<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tengo algo para ti 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,700&family=Caveat:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#fff6f1; --rosa:#f8d3db; --rosa-fuerte:#e4607f; --vino:#5a1830; --oro:#c9a24b; --oro-claro:#f0d58c;
  --serif:'Cormorant Garamond',Georgia,serif; --mano:'Caveat','Segoe Script',cursive; --sans:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--vino);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#ffe9ee 0%,var(--rosa) 55%,#eeb3c3 100%);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
#petalos{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.petalo{
  position:absolute;top:-30px;width:14px;height:18px;opacity:.85;
  background:linear-gradient(135deg,#ffb3c6,#f27a98);
  border-radius:150% 0 150% 0;
  animation:caer linear infinite;
}
@keyframes caer{
  0%{transform:translate3d(0,-30px,0) rotate(0)}
  50%{transform:translate3d(var(--dx),55vh,0) rotate(200deg)}
  100%{transform:translate3d(calc(var(--dx)*-.6),110vh,0) rotate(420deg)}
}
.pantalla{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.2rem;padding:1.5rem;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;
}
.pantalla.activa{opacity:1;visibility:visible}
h1,h2{font-family:var(--serif);font-style:italic;font-weight:700;line-height:1.1}
h1{font-size:clamp(2rem,9vw,3rem)}
h2{font-size:clamp(1.8rem,8vw,2.6rem)}
.sub{font-size:1rem;max-width:30ch;opacity:.85}
.btn{
  font-family:var(--sans);font-weight:700;font-size:1.05rem;border:0;border-radius:999px;cursor:pointer;
  padding:.9rem 2rem;color:#fff;background:var(--rosa-fuerte);box-shadow:0 8px 20px rgba(228,96,127,.4);
  transition:transform .2s;
}
.btn:active{transform:scale(.95)}
.btn.suave{background:var(--vino);box-shadow:0 8px 20px rgba(90,24,48,.3)}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}

/* Cofre */
#cofre{width:min(72vw,300px);background:none;border:0;cursor:pointer;position:relative;animation:latir 2.4s ease-in-out infinite}
#cofre svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 14px 18px rgba(90,24,48,.35))}
#tapa{transform-origin:28px 84px;transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
#cofre.abierto{animation:none}
#cofre.abierto #tapa{transform:rotate(-38deg) translate(-4px,-6px)}
#luz{opacity:0;transition:opacity 1s .3s}
#cofre.abierto #luz{opacity:1}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* Galería */
.polaroid{
  background:#fff;padding:12px 12px 16px;border-radius:6px;width:min(78vw,320px);
  box-shadow:0 14px 30px rgba(90,24,48,.28);transform:rotate(-2deg);transition:transform .4s;
}
.polaroid.cambio{transform:rotate(3deg) scale(.96)}
.foto{
  width:100%;aspect-ratio:4/5;border-radius:3px;background:linear-gradient(160deg,#ffd6e0,#f7a1b8);
  display:grid;place-items:center;font-size:4rem;overflow:hidden;
}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
#frase{font-family:var(--mano);font-size:1.6rem;line-height:1.15;margin-top:12px;min-height:3.6rem;display:grid;place-items:center}
.nav{display:flex;gap:.8rem;align-items:center}
.nav .btn{padding:.7rem 1.4rem}
#puntos{display:flex;gap:6px}
#puntos i{width:8px;height:8px;border-radius:50%;background:var(--vino);opacity:.25}
#puntos i.on{opacity:1;background:var(--rosa-fuerte)}

/* Carta */
.papel{
  background:var(--crema);border-radius:10px;padding:1.6rem 1.4rem;width:min(92vw,420px);max-height:62dvh;overflow:auto;
  text-align:left;box-shadow:0 14px 34px rgba(90,24,48,.3);border:2px solid var(--oro-claro);
}
#texto{font-family:var(--mano);font-size:1.5rem;line-height:1.3;white-space:pre-wrap}
#firma{font-family:var(--mano);font-size:1.7rem;text-align:right;margin-top:.8rem;opacity:0}
#firma.ver{opacity:1;transition:opacity 1s}

/* Pregunta */
#botones{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;min-height:5rem}
#si{transition:transform .3s}
#no{background:#8a6b75;box-shadow:none}
#no.huye{position:fixed;z-index:10;transition:left .25s,top .25s}

/* Final */
.corazon-grande{font-size:5rem;animation:latir 1.2s ease-in-out infinite}
.suelto{position:fixed;z-index:5;pointer-events:none;font-size:1.6rem;animation:subir 2.6s ease-out forwards}
@keyframes subir{
  0%{opacity:1;transform:translate(0,0) scale(.6)}
  100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3) rotate(var(--r))}
}
#musica{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0));z-index:9;width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.7);font-size:1.2rem;cursor:pointer;display:none}
@media (prefers-reduced-motion:reduce){
  .petalo,#cofre,.corazon-grande{animation:none}
  .pantalla,#tapa{transition-duration:.01s}
}
</style>
</head>
<body>

<!-- ============ EDITA SOLO ESTA PARTE ============ -->
<script>
const CONFIG = {
  nombre: "Danni",            // su nombre
  tuNombre: "Alex",       // tu nombre (firma de la carta)
  musica: "cancion.mp3",               // opcional: "cancion.mp3" (ponla en la misma carpeta)
  fotos: [                  // pon tus fotos en la misma carpeta que este archivo
    { src: "foto1.jpg", frase: "Desde que te conocí, mis días tienen otro color." },
    { src: "foto2.jpg", frase: "Tu sonrisa es mi parte favorita del día." },
    { src: "foto3.jpg", frase: "Contigo hasta lo simple se vuelve especial." },
    { src: "foto4.jpg", frase: "No sé qué tiene tu mirada, pero me hace querer quedarme." }
  ],
  carta:
`Hola, {nombre}:

No soy bueno con las palabras, pero quería intentar decirte algo que siento desde hace tiempo.

Me encanta cómo te ríes, me encanta tus ojos, cómo me haces sentir y cómo haces que cualquier momento se vuelva especial.

No te prometo ser perfecto, pero sí prometo cuidarte, hacerte reír y darte lo mejor de mí cada día.`,
  pregunta: "¿Danni mi niña quieres ser mi enamorada?",
  final: "Hiciste feliz a mi corazón 🌹"
};
</script>
<!-- ================================================= -->

<div id="petalos" aria-hidden="true"></div>
<button id="musica" aria-label="Música">🎵</button>

<!-- 1. Cofre -->
<section class="pantalla activa" id="p-cofre">
  <h1>Tengo algo para ti 💌</h1>
  <p class="sub">Ábrelo con cuidado, <span class="n"></span></p>
  <button id="cofre" aria-label="Abrir el cofre">
    <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="mad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c4a3a"/><stop offset="1" stop-color="#6b2d2a"/></linearGradient>
        <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d58c"/><stop offset="1" stop-color="#b8892f"/></linearGradient>
        <radialGradient id="rad"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="100" cy="160" rx="82" ry="8" fill="rgba(90,24,48,.25)"/>
      <g id="luz"><ellipse cx="100" cy="62" rx="90" ry="60" fill="url(#rad)"/></g>
      <!-- cuerpo -->
      <rect x="28" y="80" width="144" height="74" rx="8" fill="url(#mad)"/>
      <rect x="28" y="80" width="144" height="12" fill="url(#oro)"/>
      <rect x="28" y="142" width="144" height="12" rx="4" fill="url(#oro)"/>
      <rect x="44" y="80" width="12" height="74" fill="url(#oro)"/>
      <rect x="144" y="80" width="12" height="74" fill="url(#oro)"/>
      <rect x="88" y="88" width="24" height="30" rx="5" fill="url(#oro)" stroke="#8a6420" stroke-width="2"/>
      <circle cx="100" cy="100" r="4" fill="#5a1830"/><rect x="98.5" y="102" width="3" height="9" fill="#5a1830"/>
      <!-- tapa -->
      <g id="tapa">
        <path d="M28 84 V62 Q28 36 100 36 Q172 36 172 62 V84 Z" fill="url(#mad)"/>
        <path d="M28 84 V74 H172 V84 Z" fill="url(#oro)"/>
        <rect x="44" y="40" width="12" height="44" fill="url(#oro)" opacity=".95"/>
        <rect x="144" y="40" width="12" height="44" fill="url(#oro)" opacity=".95"/>
        <path d="M100 66 c-9-9-20 0-11 9 l11 10 11-10 c9-9-2-18-11-9z" fill="#e4607f" transform="translate(0,-6) scale(1)"/>
      </g>
    </svg>
  </button>
  <p class="sub" style="font-size:.9rem">Toca el cofre</p>
</section>

<!-- 2. Galería -->
<section class="pantalla" id="p-galeria">
  <div class="polaroid" id="polaroid">
    <div class="foto" id="foto"></div>
    <p id="frase"></p>
  </div>
  <div id="puntos"></div>
  <div class="nav">
    <button class="btn suave" id="ant" aria-label="Anterior">‹</button>
    <button class="btn" id="sig">Siguiente</button>
  </div>
</section>

<!-- 3. Carta -->
<section class="pantalla" id="p-carta">
  <h2>Una carta para ti</h2>
  <div class="papel" id="papel"><p id="texto"></p><p id="firma"></p></div>
  <button class="btn" id="seguir" style="visibility:hidden">Continuar 💗</button>
</section>

<!-- 4. Pregunta -->
<section class="pantalla" id="p-pregunta">
  <div class="corazon-grande">💖</div>
  <h1 id="pregunta"></h1>
  <div id="botones">
    <button class="btn" id="si">Sí 💖</button>
    <button class="btn" id="no">No</button>
  </div>
</section>

<!-- 5. Final -->
<section class="pantalla" id="p-final">
  <div class="corazon-grande">🌹</div>
  <h1 id="final"></h1>
  <p class="sub">Gracias por decir que sí. Esto apenas empieza.</p>
</section>

<script>
const $ = s => document.querySelector(s);
const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nombre = CONFIG.nombre;

/* Textos personalizados */
document.querySelectorAll('.n').forEach(e => e.textContent = nombre);
$('#pregunta').textContent = nombre + ", " + CONFIG.pregunta.charAt(0).toLowerCase() + CONFIG.pregunta.slice(1);
$('#final').textContent = CONFIG.final;

/* Pétalos de fondo */
(function(){
  const cont = $('#petalos');
  const n = reducir ? 6 : 22;
  for (let i = 0; i < n; i++){
    const p = document.createElement('span');
    p.className = 'petalo';
    const s = .6 + Math.random() * .9;
    p.style.cssText = `left:${Math.random()*100}%;width:${14*s}px;height:${18*s}px;` +
      `--dx:${(Math.random()*120-60)}px;animation-duration:${7+Math.random()*7}s;animation-delay:${-Math.random()*12}s`;
    cont.appendChild(p);
  }
})();

/* Cambio de pantallas */
function ir(id){
  document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
  $('#' + id).classList.add('activa');
}

/* Emojis que suben */
function soltar(emojis, cantidad, origen){
  const r = origen ? origen.getBoundingClientRect() : {left: innerWidth/2, top: innerHeight/2, width: 0, height: 0};
  for (let i = 0; i < cantidad; i++){
    const e = document.createElement('span');
    e.className = 'suelto';
    e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left = (r.left + r.width/2 + (Math.random()*40-20)) + 'px';
    e.style.top = (r.top + r.height/2) + 'px';
    e.style.setProperty('--x', (Math.random()*260-130) + 'px');
    e.style.setProperty('--y', -(120 + Math.random()*320) + 'px');
    e.style.setProperty('--r', (Math.random()*80-40) + 'deg');
    e.style.animationDelay = (Math.random()*.5) + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 3400);
  }
}

/* Música (opcional) */
let audio = null;
if (CONFIG.musica){
  audio = new Audio(CONFIG.musica); audio.loop = true; audio.volume = .5;
  const b = $('#musica'); b.style.display = 'block';
  b.onclick = () => { if (audio.paused){ audio.play(); b.textContent='🎵'; } else { audio.pause(); b.textContent='🔇'; } };
}

/* 1. Cofre */
$('#cofre').addEventListener('click', function(){
  if (this.classList.contains('abierto')) return;
  this.classList.add('abierto');
  if (audio) audio.play().catch(()=>{});
  setTimeout(() => soltar(['💖','🌸','💗','🌹','✨'], reducir ? 6 : 22, this), 700);
  setTimeout(() => { mostrarFoto(0); ir('p-galeria'); }, 2600);
});

/* 2. Galería */
let actual = 0;
const fotos = CONFIG.fotos;
$('#puntos').innerHTML = fotos.map(() => '<i></i>').join('');
function mostrarFoto(i){
  actual = i;
  const f = fotos[i];
  const marco = $('#foto');
  marco.innerHTML = '';
  const img = new Image();
  img.alt = 'Foto ' + (i+1);
  img.onload = () => { marco.innerHTML = ''; marco.appendChild(img); };
  img.onerror = () => { marco.textContent = '🌸'; };
  img.src = f.src;
  marco.textContent = '🌸';
  $('#frase').textContent = f.frase;
  document.querySelectorAll('#puntos i').forEach((p, k) => p.classList.toggle('on', k === i));
  $('#sig').textContent = i === fotos.length - 1 ? 'Sigue 💌' : 'Siguiente';
  $('#polaroid').classList.add('cambio');
  setTimeout(() => $('#polaroid').classList.remove('cambio'), 250);
}
function siguiente(){
  if (actual < fotos.length - 1) mostrarFoto(actual + 1);
  else { ir('p-carta'); escribirCarta(); }
}
function anterior(){ if (actual > 0) mostrarFoto(actual - 1); }
$('#sig').onclick = siguiente;
$('#ant').onclick = anterior;
let x0 = null;
$('#p-galeria').addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
$('#p-galeria').addEventListener('touchend', e => {
  if (x0 === null) return;
  const d = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(d) > 50) d < 0 ? siguiente() : anterior();
});

/* 3. Carta con efecto de escritura */
let escribiendo = false, textoFinal = '';
function escribirCarta(){
  if (escribiendo) return;
  escribiendo = true;
  textoFinal = CONFIG.carta.replace(/\{nombre\}/g, nombre);
  const t = $('#texto'); t.textContent = '';
  let i = 0;
  const firma = $('#firma'); firma.textContent = 'Con cariño, ' + CONFIG.tuNombre + ' 💗';
  const papel = $('#papel');
  const fin = () => {
    clearInterval(timer);
    t.textContent = textoFinal; firma.classList.add('ver');
    $('#seguir').style.visibility = 'visible';
  };
  const timer = setInterval(() => {
    t.textContent = textoFinal.slice(0, ++i);
    papel.scrollTop = papel.scrollHeight;
    if (i >= textoFinal.length) fin();
  }, reducir ? 4 : 32);
  papel.onclick = fin;
}
$('#seguir').onclick = () => ir('p-pregunta');

/* 4. Pregunta: el "No" se escapa */
const no = $('#no'), si = $('#si');
let escapes = 0;
const frasesNo = ['No','¿Segura?','Piénsalo 🥺','Mmm…','Ese no 😅'];
function huir(e){
  e.preventDefault();
  escapes++;
  no.textContent = frasesNo[Math.min(escapes, frasesNo.length - 1)];
  no.classList.add('huye');
  const m = 12;
  const w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = (m + Math.random() * (innerWidth - w - 2*m)) + 'px';
  no.style.top = (m + Math.random() * (innerHeight - h - 2*m)) + 'px';
  si.style.transform = `scale(${Math.min(1 + escapes * .12, 1.8)})`;
}
['pointerenter','touchstart','click'].forEach(ev => no.addEventListener(ev, huir, {passive:false}));

/* 5. Final */
si.onclick = () => {
  ir('p-final');
  const lanzar = () => soltar(['💖','🌹','🌸','💗','💕','✨','🌷'], reducir ? 8 : 28);
  lanzar();
  if (!reducir){ const t = setInterval(lanzar, 900); setTimeout(() => clearInterval(t), 9000); }
};
</script>
</body>
</html>
